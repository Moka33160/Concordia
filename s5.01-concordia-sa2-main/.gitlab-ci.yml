stages:
  - lint

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

.lint_base:
  stage: lint
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

pyflakes:
  extends: .lint_base
  script:
    - pip install pyflakes
    - pyflakes .

pycodestyle:  # PEP 8 checker (successor to "pychecker" for style rules)
  extends: .lint_base
  script:
    - pip install pycodestyle
    - pycodestyle --max-line-length=99 .

pylint:
  extends: .lint_base
  script:
    - pip install pylint
    - |
      find . -name "*.py" -not -path "./.venv/*" -print0 \
        | xargs -0 pylint --fail-under=8.0
