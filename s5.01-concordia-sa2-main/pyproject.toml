[project]
name = "s5-01-concordia-sa2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dotenv==0.9.9",
    "oracledb>=4.0.2",
    "pillow>=11",
    "pytest>=9.1.1",
    "python-dotenv==1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concordia"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: needs a real Oracle database reachable on localhost:1521",
]
